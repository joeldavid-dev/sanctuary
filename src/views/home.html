<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    font-src 'self';
    img-src 'self' data:;
    object-src 'none';
    base-uri 'none';
    ">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/home.css">
    <script type="module" src="../renderer/homeRenderer.js" defer></script>
    <title>Codaby Sanctuary</title>
</head>

<body>
    <div class="layout horizontal-flex">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar vertical-flex centered spaced">
            <div class="vertical-flex big-spaced normal-padding">
                <div class="vertical-flex centered">
                    <button id="lock-btn" class="transparent-btn transparent-btn-padding radius-1">
                        <span class="svg-icon normal-icon icon-lock"></span>
                    </button>
                    <label class="small-text hide-in-small" data-i18n="block"></label>
                </div>

                <div class="vertical-flex centered">
                    <label id="keys-radio" class="transparent-radio transparent-btn-padding radius-1">
                        <input type="radio" name="sidebar-option" id="keys" checked>
                        <span class="svg-icon normal-icon icon-key"></span>
                    </label>
                    <label class="small-text hide-in-small" data-i18n="keys"></label>
                </div>

                <div class="vertical-flex centered">
                    <label id="notes-radio" class="transparent-radio transparent-btn-padding radius-1">
                        <input type="radio" name="sidebar-option" id="notes">
                        <span class="svg-icon normal-icon icon-book"></span>
                    </label>
                    <label class="small-text hide-in-small" data-i18n="notes"></label>
                </div>

                <div class="vertical-flex centered">
                    <label id="settings-radio" class="transparent-radio transparent-btn-padding radius-1">
                        <input type="radio" name="sidebar-option" id="settings">
                        <span class="svg-icon normal-icon icon-settings"></span>
                    </label>
                    <label class="small-text hide-in-small" data-i18n="settings"></label>
                </div>
            </div>

            <div id="hollydays-background" class="vertical-flex centered normal-padding background-image">
                <button id="app-btn" class="transparent-btn transparent-btn-padding radius-1">
                    <img id="app-icon" src="../assets/ico/sanctuary.png" class="normal-icon">
                    <div id="update-container" class="update-container">
                        <span id="update-img"
                            class="svg-icon svg-icon-white update-icon mini-icon icon-arrow-down"></span>
                    </div>
                </button>
            </div>
        </aside>

        <!-- Contenido -->
        <main id="main-section" class="main-section hidden-scrollbar">
            <!-- Barra de titulo -->
            <header id="title-bar"
                class="title-bar normal-padding horizontal-elem-area draggable spaced centered colored-blur">
                <h2 id="title"></h2>
                <div id="search-area" class="horizontal-elem-area centered">
                    <input id="search-input" type="text" class="search option-input radius-1" inputmode="search">
                    <button id="search-clear" class="transparent-btn transparent-btn-padding radius-1 drag-safe">
                        <span id="search-clear-ico" class="svg-icon mini-icon icon-search"></span>
                    </button>
                </div>
                <div id="order-area" class="horizontal-elem-area centered">
                    <button id="order-btn"
                        class="action-btn horizontal-elem-area centered transparent-btn-padding radius-1 drag-safe">
                        <label id="order-label" class="small-text"></label>
                        <span id="order-ico" class="svg-icon mini-icon icon-chevron-down"></span>
                    </button>
                    <button id="sort-toggle"
                        class="action-btn horizontal-flex transparent-btn-padding radius-1 drag-safe">
                        <span id="sort-toggle-ico" class="svg-icon mini-icon icon-arrow-up"></span>
                    </button>
                </div>
                <div class="horizontal-elem-area centered">
                    <label id="friendly-reminder" class="friendly-reminder invisible"></label>
                    <button id="minimize" class="transparent-btn transparent-btn-padding radius-1 drag-safe">
                        <span class="svg-icon normal-icon icon-minus-circle"></span>
                    </button>
                    <button id="maximize" class="transparent-btn transparent-btn-padding radius-1 drag-safe">
                        <span class="svg-icon normal-icon icon-maximize"></span>
                    </button>
                    <button id="close" class="transparent-btn transparent-btn-padding radius-1 drag-safe">
                        <span class="svg-icon normal-icon icon-x-circle"></span>
                    </button>
                </div>
            </header>
            <!-- Barra de opciones -->
            <div id="command-options-bar"
                class="command-options-bar popup-list narrow-padding external-radius-1 vertical-elem-area colored-blur scrolleable">
            </div>

            <div id="main-content" class="elements-container normal-padding normal-spaced centered reverse">
                <!-- Aquí se insertan los elementos creados -->
            </div>

            <!-- bottonbar -->
            <footer id="botton-bar"
                class="botton-bar popup-list narrow-padding external-radius-1 horizontal-flex colored-blur big-spaced">

                <div id="edit-element-body" class="vertical-flex centered">
                    <button id="edit-element" class="transparent-btn transparent-btn-padding radius-1 invisible">
                        <span class="svg-icon normal-icon icon-edit"></span>
                    </button>
                    <label class="small-text no-wrapped-text" data-i18n="edit"></label>
                </div>

                <div class="vertical-flex centered">
                    <button id="new-element" class="transparent-btn transparent-btn-padding radius-1">
                        <span class="svg-icon normal-icon icon-plus-circle"></span>
                    </button>
                    <label class="small-text no-wrapped-text" data-i18n="new"></label>
                </div>

                <div id="delete-element-body" class="vertical-flex centered">
                    <button id="delete-element" class="transparent-btn transparent-btn-padding radius-1 invisible">
                        <span class="svg-icon normal-icon icon-trash"></span>
                    </button>
                    <label class="small-text no-wrapped-text" data-i18n="delete"></label>
                </div>

            </footer>
            <!-- Área de configuraciones -->
            <div id="settings-area" class="elements-container normal-padding"></div>
        </main>
    </div>

    <!-- Place holder -->
    <div id="placeholder" class="modal blur draggable">
        <div class="placeholder-content">
            <div class="spinner"></div>
            <p id="placeholder-loading" data-i18n="placeholder-loading"></p>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal blur">
        <div id="modal-content" class="modal-content scrolleable">
            <div class="modal-header normal-padding colored-blur">
                <h2 id="modal-title"></h2>
                <button id="close-modal" class="transparent-btn transparent-btn-padding radius-1 drag-safe">
                    <span class="svg-icon normal-icon icon-x-circle"></span>
                </button>
            </div>
            <!-- Contenido del modal -->
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Modal de advertencia -->
    <div id="modal-warning" class="modal blur no-draggable">
        <div class="modal-content-warning scrolleable">
            <div class="modal-header normal-padding">
                <span class="svg-icon svg-icon-white normal-icon icon-alert-triangle"></span>
                <h2 id="modal-warning-title"></h2>
                <button id="close-modal-warning" class="transparent-btn transparent-btn-padding radius-1 drag-safe">
                    <span class="svg-icon svg-icon-white normal-icon icon-x-circle"></span>
                </button>
            </div>
            <!-- Contenido del modal warning -->
            <div id="modal-warning-body"></div>
        </div>
    </div>

    <div id="toast-container"></div>
    <div id="popup-list"
        class="popup-list narrow-padding external-radius-1 vertical-elem-area colored-blur scrolleable"></div>
</body>

</html>
